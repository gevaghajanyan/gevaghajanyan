name: Metrics
on:
  schedule: [{cron: "0 1 * * *"}]
  push: {branches: ["master", "main"]}
  workflow_dispatch:

jobs:
  isocalendar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@v3
        with:
          filename: metrics.plugin.isocalendar.fullyear.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: gevaghajanyan
          base: ""
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

  achievements:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@v3
        with:
          filename: metrics.achievements.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: gevaghajanyan
          base: ""
          base_indepth: yes
          plugin_achievements: yes
          repositories_affiliations: owner
          plugin_achievements_secrets: yes
          plugin_achievements_display: compact

  languages:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@v3
        with:
          filename: metrics.languages.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: gevaghajanyan
          base: ""
          base_indepth: yes
          plugin_languages: yes
          repositories_affiliations: owner, collaborator, organization-member
          plugin_languages_indepth: yes
          plugin_languages_analysis_timeout: 15
          plugin_languages_recent_load: 500
          plugin_languages_recent_days: 0
          plugin_languages_colors: rainbow
          plugin_languages_ignored: html, css, php, c++
